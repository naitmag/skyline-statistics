<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">

<meta name="description" content="Волейбольная статистика команды SKYLINE: баланс очков, ошибки, рейтинги и точки роста.">
<meta name="theme-color" content="#0d1117">

<title>SKYLINE — волейбольная статистика</title>
<script>(function(){try{var t=localStorage.getItem('skyline-theme');if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
<style>
:root{
  --bg:#0d1117;--bg2:#111722;--card:#161d29;--line:#202a3a;--line2:#2a3650;
  --txt:#e6edf7;--muted:#93a3b8;--dim:#64748f;
  --good:#3ddc84;--warn:#fbbf24;--bad:#f87171;
  --pass:#38bdf8;--attack:#fb923c;--recv:#34d399;--def:#a78bfa;--pod:#f472b6;--block:#facc15;--serve:#22d3ee;
  --acc:#5eead4;--acc2:#7dd3fc;
  --hover:rgba(255,255,255,.03);--neu:rgba(255,255,255,.06);
}
[data-theme="light"]{
  --bg:#f2f4f9;--bg2:#e7ebf2;--card:#ffffff;--line:#d7ddeb;--line2:#c1cbe2;
  --txt:#17202e;--muted:#45536a;--dim:#75849b;
  --good:#0e9f53;--warn:#b47a00;--bad:#d13535;
  --pass:#0d76b8;--attack:#dd6a1d;--recv:#0e9b6e;--def:#7446cf;--pod:#cf3f80;--block:#c7960a;--serve:#0aa0b0;
  --acc:#0d9488;--acc2:#0284c7;
  --hover:rgba(10,20,40,.045);--neu:rgba(10,20,40,.07);
}
@media(prefers-color-scheme:dark){:root{color-scheme:dark}[data-theme="light"]{color-scheme:light}}
*{box-sizing:border-box;margin:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
header.hero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:26px 0 16px}
header.hero h1{font-size:26px;font-weight:800;letter-spacing:.02em;background:linear-gradient(90deg,#e6edf7,#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
header.hero .sub{color:var(--muted);font-size:13px;margin-top:4px}
header.hero .tags{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.tag b{color:var(--txt);font-weight:700}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
.tab{background:none;color:var(--muted);border:1px solid transparent;font:inherit;font-weight:600;padding:8px 16px;border-radius:10px;cursor:pointer;transition:.15s}
.tab:hover{color:var(--txt);background:var(--bg2)}
.tab.active{color:var(--txt);background:var(--bg2);border-color:var(--line2);box-shadow:0 0 0 1px var(--acc) inset}
.view{display:none}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card.pad0{padding:0;overflow:hidden}
.kpi{position:relative;overflow:hidden}
.kpi .glow{position:absolute;inset:0 0 auto 0;height:3px}
.k-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.k-val{font-size:26px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.k-sub{color:var(--dim);font-size:12px;margin-top:2px}
.section-title{display:flex;align-items:center;gap:12px;margin:26px 0 14px}
.section-title h2{font-size:17px;font-weight:700;white-space:nowrap}
.section-title .line{flex:1;height:1px;background:var(--line)}
.section-title .hint{color:var(--dim);font-size:12px}
.mini{color:var(--muted);font-size:12.5px;font-weight:500}
.rankbadge{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--bg2);color:var(--muted);border:1px solid var(--line2);flex:none}
.rankbadge.g1{background:#f6e27a20;color:#f6e27a;border-color:#f6e27a66}
.rankbadge.g2{background:#c8d4e620;color:#c8d4e6;border-color:#c8d4e666}
.rankbadge.g3{background:#e4936b20;color:#e4936b;border-color:#e4936b55}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th.l,td.l{text-align:left}
thead th{color:var(--dim);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card);z-index:1}
thead th.sorted{color:var(--txt)}
.arr{font-size:10px;margin-left:3px;color:var(--acc)}
tbody tr:hover{background:var(--hover)}
.name{font-weight:700}
.scroll-x{overflow-x:auto}
.tbl-wrap{overflow:auto;max-height:70vh}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--bg2);border:1px solid var(--line2);color:var(--muted);font:inherit;font-weight:600;border-radius:99px;padding:7px 14px;cursor:pointer;transition:.15s}
.chip:hover{color:var(--txt);border-color:var(--acc)}
.chip.active{color:var(--txt);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
.hero{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.hero .score{color:var(--muted)}
.mvp{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mvp .name{font-size:22px;font-weight:800}
.mvp .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.mvp .big{font-size:34px;font-weight:800;color:var(--good);font-variant-numeric:tabular-nums}
.mvp .big small{display:block;font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.05em;text-align:center}
.setbox{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center}
.setbox .sn{color:var(--dim);font-size:11px}
.setbox .sp{font-size:18px;font-weight:800}
.setbox .se{color:var(--muted);font-size:11px}
.bar-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.bar-row .bl{width:96px;flex:none;color:var(--txt);font-weight:600}
.bar-row .bv{width:110px;flex:none;text-align:right;font-variant-numeric:tabular-nums}
.bar{flex:1;height:9px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.bar-row .bpos,.bar-row .bneg{flex:none;width:64px;font-size:11.5px;color:var(--muted)}
.meter{display:flex;height:20px;border-radius:6px;overflow:hidden;background:var(--bg2);border:1px solid var(--line)}
.meter i.pos{background:linear-gradient(90deg,#2ecc71aa,#3ddc84)}
.meter i.neg{background:linear-gradient(90deg,#f87171,#ef4444)}
.meter i.neu{background:var(--neu)}
.mini-tag{font-size:10px;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:2px 7px;white-space:nowrap;vertical-align:middle;margin-left:8px}
table.mt th,table.st th{position:static}
.skill-note{color:var(--dim);font-size:11.5px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.footer{color:var(--dim);font-size:12px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line);line-height:1.7}
.method h3{font-size:15px;margin:18px 0 8px;color:var(--txt)}
.method p,.method li{color:var(--muted);font-size:13.5px;line-height:1.65}
.method ul{padding-left:20px;margin:6px 0}
.formula{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:600 12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--acc);overflow-x:auto;white-space:nowrap}
.legend-item{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.legend-item:last-child{border-bottom:0}
.legend-item .lg{width:10px;height:10px;border-radius:3px;margin-top:6px;flex:none}
.legend-item .lt{font-weight:700;font-size:13.5px}
.legend-item .ld{color:var(--muted);font-size:12.5px}
.method code{background:var(--bg2);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--acc)}
.meta-line{color:var(--muted);font-size:13px;line-height:1.6;padding:6px 0;border-bottom:1px dashed var(--line)}
.meta-line:last-child{border-bottom:0}
.meta-line b{color:var(--txt);font-weight:700}
.note{background:linear-gradient(180deg,var(--bg2),transparent);border:1px solid var(--line2);border-left:4px solid var(--acc);border-radius:12px;padding:16px 18px;margin-top:14px}
.note h3{color:var(--acc);margin-top:0}
.note p,.note li{font-size:13px;color:var(--muted)}
.note b{color:var(--txt)}
.method .m2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.kv{display:grid;gap:0;margin-top:8px}
.kv-i{padding:9px 0 9px 12px;border-bottom:1px dashed var(--line);border-left:2px solid var(--line2)}
.kv-i:last-child{border-bottom:0}
.kv-k{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--acc);font-weight:700;margin-bottom:3px}
.kv-v{display:block;color:var(--muted);font-size:13px;line-height:1.6}
.m-legend{list-style:none;padding:0;margin:12px 0 4px}
.m-legend li{display:flex;gap:10px;align-items:baseline;padding:5px 0;font-size:13px;color:var(--muted);line-height:1.6}
.m-legend b{color:var(--txt)}
.dp{width:10px;height:10px;border-radius:3px;flex:none;transform:translateY(1px)}
.dp.pos{background:var(--good)}
.dp.neg{background:var(--bad)}
.dp.nul{background:var(--dim)}
.ms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;margin-top:12px}
.ms-i{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.msbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.msn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--txt)}
.msn .sk-dot{width:9px;height:9px;border-radius:3px;flex:none}
.msd{color:var(--muted);font-size:12.5px;line-height:1.6;margin:8px 0 10px}
.ms-i .formula{margin:0}
.method .m-legend{list-style:none;padding:0;margin:12px 0 4px}
.method .mini{font-size:12.5px;color:var(--muted)}
table.mt th,table.st th{cursor:default}
.export-btn,.theme-btn{background:var(--bg2);border:1px solid var(--line2);color:var(--muted);font:600 11.5px system-ui,sans-serif;border-radius:99px;padding:5px 12px;cursor:pointer;transition:.15s;white-space:nowrap}
.export-btn:hover,.theme-btn:hover{color:var(--txt);border-color:var(--acc)}
tr.small-sample{opacity:.55}
thead th[aria-sort]{cursor:pointer}
.table-tool{display:flex;gap:10px;margin:18px 0 10px;align-items:center;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}.view.active{animation:none}}
@media print{
  html,body{background:#fff!important}
  :root,[data-theme]{--bg:#fff;--bg2:#f2f4f8;--card:#fff;--line:#cbd3e1;--line2:#cbd3e1;--txt:#111;--muted:#333;--dim:#555;
    --good:#0e9f53;--warn:#b47a00;--bad:#d13535;--pass:#0d76b8;--attack:#dd6a1d;--recv:#0e9b6e;--def:#7446cf;--pod:#cf3f80;--block:#c7960a;--serve:#0aa0b0;--acc:#0d9488;--acc2:#0284c7;--hover:#00000008;--neu:#00000008}
  .tabs,.chips,.export-btn,.theme-btn,.tag{display:none!important}
  .view{display:block!important;margin-bottom:28px}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #ccd3e0}
  .wrap{max-width:none;padding:0}
  .tbl-wrap,.scroll-x{max-height:none;overflow:visible}
  thead th{position:static;background:#f2f4f8!important}
  .section-title{break-after:avoid}
  tr.small-sample{opacity:1}
}
@media(max-width:640px){.kpis{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:640px){
  .wrap{padding:14px 12px 48px}
  header.hero{padding:20px 0 12px}
  header.hero h1{font-size:22px}
  nav.tabs{padding-bottom:10px;margin-bottom:14px}
  .tab{flex:1 1 30%;text-align:center;padding:9px 8px;font-size:13px}
  .section-title{flex-wrap:wrap;gap:4px 10px;margin:20px 0 12px}
  .section-title .hint{flex-basis:100%}
  th,td{padding:8px 10px}
  .tbl-wrap{max-height:60vh}
  .chip{padding:8px 13px}
  .footer{margin-top:28px}
}
@media(max-width:520px){
  .hero{flex-direction:column;align-items:flex-start}
  .hero > div{margin-left:0!important;text-align:left!important}
  .hero .score{margin-top:10px!important}
  .mvp{flex-direction:column;align-items:flex-start;gap:10px}
  .mvp > div{margin-left:0!important;text-align:left!important}
  .mvp .big{font-size:28px}
  .k-val{font-size:22px}
  header.hero .tags{margin-left:0}
  .setbox{padding:7px 10px}
  .setbox .sp{font-size:16px}
  .bar-row .bl{width:80px;font-size:12.5px}
  .bar-row .bv{width:90px}
}
html{-webkit-text-size-adjust:100%}
.legend-item .grow{flex:1}
@media(max-width:800px){
  .tbl-wrap td:first-child,.tbl-wrap th:first-child,table[data-fname="match"] td:first-child,table[data-fname="match"] th:first-child{position:sticky;left:0;z-index:2;background:var(--card);box-shadow:1px 0 0 var(--line)}
  .tbl-wrap thead th:first-child{z-index:4}
}
@media(max-width:640px){
  nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-12px;margin-right:-12px;padding:8px 12px}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;white-space:nowrap}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .chip{flex:none;white-space:nowrap}
  .tab,.chip,.export-btn,.theme-btn{min-height:40px}
  input,select{font-size:16px}
  .filter-bar label,#mf-name{min-width:0!important;width:100%}
  .filter-bar label{flex:1 1 140px}
  .legend-item[style*="align-items:center"]{flex-wrap:wrap;gap:4px 12px}
  .legend-item[style*="align-items:center"]>div{width:auto!important;flex:1 1 auto!important;text-align:left!important}
  .legend-item[style*="align-items:center"]>div:first-child{flex-basis:100%!important}
  .card{padding:14px}
  .k-val{font-size:22px}
}
@media(max-width:520px){
  .bar-row{flex-wrap:wrap;gap:3px 8px}
  .bar-row .bl{width:auto;flex:1}
  .bar-row .bar{order:9;flex:1 1 100%}
  .bar-row .bv{width:auto}
  .section-title h2{white-space:normal}
}
input,select{background:var(--bg2);color:var(--txt);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font:inherit}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
svg{max-width:100%;height:auto}
.big small{display:block;font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.bar-row .bpos,.bar-row .bneg{width:auto;min-width:78px;white-space:nowrap}
[data-theme="light"] header.hero h1{background-image:linear-gradient(90deg,#0f2a43,#0d9488)}
[data-theme="light"] .rankbadge.g1{background:#f6e27a66;color:#8a6d00;border-color:#c9a400}
[data-theme="light"] .rankbadge.g2{background:#c8d4e666;color:#4a5a73;border-color:#9aa9c2}
[data-theme="light"] .rankbadge.g3{background:#e4936b44;color:#a2532a;border-color:#d98a5f}
.spk{width:100%;height:56px;display:block;margin:6px 0 2px}
.ph th,.ph td{padding:8px 9px}
.ph th{cursor:default}
details.fold{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
details.fold>summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px;min-height:44px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:'▸';color:var(--dim);transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>.fold-body{padding:0 14px 14px}
</style>

<body>
<div class="wrap">
  <header class="hero">
    <div>
      <h1>SKYLINE · Волейбольная статистика</h1>
      <div class="sub">Осень 2026 — метрики пересчитываются из данных xlsx</div>
    </div>
    <div class="tags">
      <span class="tag">Матчей: <b id="tag-games">–</b></span>
      <span class="tag" style="display:none">Игроков: <b id="tag-players">–</b></span>
      <span class="tag no-print" style="display:none">Данные: xlsx · метрики на странице</span>
      <button id="theme-btn" class="theme-btn no-print" type="button" title="Переключить тему оформления" aria-label="Переключить тему оформления">Тема</button>
    </div>
  </header>

  <noscript><div style="padding:18px 20px;margin:6px 0 14px;background:#fff8d9;color:#6b5200;border:1px solid #e6d488;border-radius:12px">Для работы страницы необходим включённый JavaScript — все метрики вычисляются локально в браузере.</div></noscript>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Разделы"></nav>

  <section class="view" id="v-overview"></section>
  <section class="view" id="v-ranking"></section>
  <section class="view" id="v-matches"></section>
  <section class="view" id="v-players"></section>
  <section class="view" id="v-method"></section>

  <div class="footer">Данные: xlsx · метрики считаются на странице (см. «Методика») · последний матч: <span id="gen-date">–</span></div>
</div>

/* ================== конфиг навыков (Data Volley E%) ================== */
const SK = {
  pass  : {name:'Связка', arr:'p',  n:4, pos:[1],    neg:[2,3],    err:[3], top:1, topT:'передач с позитива',  c:'--pass'},
  attack: {name:'Атака',  arr:'a',  n:5, pos:[2],    neg:[3],      err:[3], top:2, topT:'очков с атаки',       c:'--attack'},
  recv  : {name:'Приём',  arr:'r',  n:5, pos:[1,2],  neg:[0,3,4],  err:[4], top:2, topT:'идеальных приёмов',   c:'--recv'},
  def   : {name:'Защита', arr:'df', n:5, pos:[1,2],  neg:[0,3,4],  err:[4], top:2, topT:'идеальных защит',     c:'--def'},
  pod   : {name:'Подбор', arr:'pd', n:3, pos:[1],    neg:[2],      err:[2], top:1, topT:'идеальных подборов',  c:'--pod'},
  block : {name:'Блок',   arr:'b',  n:3, pos:[1],    neg:[2],      err:[2], top:1, topT:'блок-очков',          c:'--block'},
  serve : {name:'Подача', arr:'s',  n:4, pos:[2],    neg:[3],      err:[3], top:2, topT:'эйсов',               c:'--serve'}
};
const SK_ORDER = ['pass','attack','recv','def','pod','block','serve'];

/* ================== движок ================== */
const add = (a, b) => a.map((v, i) => v + (b[i] || 0));
const zero = () => ({p:[0,0,0,0,0], a:[0,0,0,0,0,0], r:[0,0,0,0,0,0], df:[0,0,0,0,0,0], pd:[0,0,0,0], b:[0,0,0,0], s:[0,0,0,0,0]});

function skillStat(ct, key){
  const c = SK[key], A = ct[c.arr];
  const n = A[c.n] || 0;
  const pos = c.pos.reduce((s,i)=>s+(A[i]||0),0);
  const neg = c.neg.reduce((s,i)=>s+(A[i]||0),0);
  const err = c.err.reduce((s,i)=>s+(A[i]||0),0);
  const top = A[c.top] || 0;
  return {n,pos,neg,err,top,
    eff:     n ? (pos-neg)/n : null,
    posPct:  n ? pos/n : null,
    negPct:  n ? neg/n : null,
    errPct:  n ? err/n : null,
    topPct:  n ? top/n : null};
}
function compute(ct){
  const sk = {}; let P = 0, N = 0, T = 0;
  for(const k of SK_ORDER){ sk[k] = skillStat(ct,k); P += sk[k].pos; N += sk[k].neg; T += sk[k].n; }
  const pts = (ct.a[2]||0) + (ct.b[1]||0) + (ct.s[2]||0);
  const err = (ct.p[3]||0)+(ct.a[3]||0)+(ct.r[4]||0)+(ct.df[4]||0)+(ct.pd[2]||0)+(ct.b[2]||0)+(ct.s[3]||0);
  return {sk, vol:T, eff:T?((P-N)/T):null, pos:P, neg:N, pts, err, util:pts-err};
}
const playerPlayed = (g, pi) => { const o = g.pl[pi][5]; return SK_ORDER.some(k => (o[SK[k].arr]||[]).reduce((s,v)=>s+v,0) > 0); };
function mergeCounts(pi){
  const ct = zero();

  return ct;
}
function teamMatchCounts(g){ const ct = zero(); g.pl.forEach(pg => { for(const k in ct) ct[k] = add(ct[k], pg[5][k]||[]); }); return ct; }

  const c = compute(mergeCounts(pi));
  return Object.assign({name, pi, games, sets, netSet: sets? c.util/sets : null, e100: c.vol? c.err/c.vol*100 : null}, c);
});

  v = TABS.map(t=>t[0]).includes(v) ? v : 'overview';
  if(v==='matches'){ const gi=parseInt(arg,10); if(Number.isFinite(gi) && GAMES[gi]) state.match=gi; }

  setView(v);
  commitHash();
}
function setView(v){
  if(!TABS.map(t=>t[0]).includes(v)) v='overview';

  document.querySelectorAll('.view').forEach(s => s.classList.remove('active'));

function applyHash(){
  const h = (location.hash||'').replace(/^#/,'');
  const i = h.indexOf('/');
  const v = i>=0 ? h.slice(0,i) : h;
  const arg = i>=0 ? h.slice(i+1) : undefined;
  navigate(v, arg);
}
window.addEventListener('hashchange', applyHash);

function exportTableCSV(tbl, fname){
  try{
    if(typeof URL==='undefined' || typeof URL.createObjectURL!=='function'){ console.warn('CSV: экспорт недоступен в этом окружении'); return; }
    const rows = [...tbl.querySelectorAll('tr')].map(tr => [...tr.querySelectorAll('th,td')].map(c => {
      const t = c.textContent.replace(/[▲▼]/g,'').replace(/\s+/g,' ').trim();
      return '"'+t.replace(/"/g,'""')+'"';
    }).join(',')).join('\r\n');
    const blob = new Blob(['\ufeff'+rows], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    a.rel = 'noopener';
    document.body.appendChild(a);
    try{ a.click(); }
    catch(e){ console.warn('CSV: операция прервана браузером', e); }
    finally{ a.remove(); }
  }catch(e){ console.warn('CSV: не удалось сформировать файл', e); }
}
document.addEventListener('click', e => {
  const b = e.target.closest('.export-btn');
  if(!b || !b.dataset.fname) return;
  const tbl = document.querySelector('table[data-fname="'+b.dataset.fname+'"]');
  if(tbl) exportTableCSV(tbl, b.dataset.fname+'.csv');
});

function errorSources(sk){
  const items = SK_ORDER.map(k=>{
    const c=SK[k], s=sk[k];
    return {k, name:c.name, color:'var('+c.c+')', err:s.err};
  }).filter(x=>x.err>0).sort((a,b)=>b.err-a.err);
  const total = items.reduce((s,x)=>s+x.err,0);

  const segments = items.map(x=>`<i style="width:${(x.err/total*100).toFixed(1)}%;background:${x.color}"></i>`).join('');

      <div class="bar"><i style="width:${(x.err/mx*100).toFixed(1)}%;background:${x.color}"></i></div>
      <div class="bv" style="width:44px;${i===0?'font-weight:800;color:var(--bad)':''}">${fmtNum(x.err)}</div>

}

function benchVerdict(v,b){
  if(v==null || !Number.isFinite(v)) return null;
  if(b.dir<0) return v<=b.great ? 'ok' : (v<=b.ok ? 'mid' : 'bad');
  return v>=b.great ? 'ok' : (v>=b.ok ? 'mid' : 'bad');
}
function benchTag(v,b){
  if(benchVerdict(v,b)==null) return '';
  const s=benchVerdict(v,b);
  const cfg={ok:{t:b.dir<0?'заметно меньше среднего':'лучше среднего по команде',c:'var(--good)'},
             mid:{t:b.dir<0?'около среднего':'около среднего',c:'var(--acc2)'},
             bad:{t:b.dir<0?'ошибок больше среднего':'хуже среднего по команде',c:'var(--warn)'}}[s];
  return `<span class="mini-tag" style="border-color:${cfg.c};color:${cfg.c}">${cfg.t}</span>`;
}

const wilsonLo=(k,n)=>{if(!n)return 0;const z=1.96,p=k/n,d=1+z*z/n;return (p+z*z/(2*n)-z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n)))/d;};
function dataChecks(){
  const w=[];
  GAMES.forEach(g=>{[0,1,2,3,4].forEach(s=>{const P=g.tm.pt[s]||0; if(!P) return;
    const W=g.pl.reduce((a,pl)=>a+pl[s].a[2]+pl[s].b[1]+pl[s].s[2],0);
    const E=g.pl.reduce((a,pl)=>a+pl[s].p[3]+pl[s].a[3]+pl[s].r[4]+pl[s].df[4]+pl[s].pd[2]+pl[s].b[2]+pl[s].s[3],0);
    if(Math.abs(W+g.tm.op[s]-P)>0.01) w.push(`${g.dt} партия ${s+1}: очки ${P} ≠ чистые ${W} + ошибки соперника ${g.tm.op[s]}`);
    if(Math.abs(E-g.tm.er[s])>0.01) w.push(`${g.dt} партия ${s+1}: ошибки игроков ${E} ≠ ошибки команды ${g.tm.er[s]}`);});});
  return w;
}

/* ================== ход партии (лог розыгрышей) и динамика ================== */
const PH_NAMES=['Старт','Середина','Концовка'];
const EVS={'Подача':'Подача','Атака':'Атака','Прием':'Приём','Защита':'Защита','Блок':'Блок','Передача':'Др.','Подбор':'Др.'};
const ESK=['Подача','Атака','Приём','Защита','Блок','Др.'];
function setRallies(g,si){
  const raw=(g.rl&&g.rl[si])||[]; const tgt=si===4?15:25; let a=0,b=0;
  return raw.map((r,i)=>{ const m=Math.max(a,b), ph=m<tgt*0.4?0:(m<tgt*0.8?1:2);
    const o={w:r[0],k:r[1],ev:r[2],oe:r[3],op:r[4],pis:r[5],a,b,ph,i}; if(r[0]) a++; else b++; o.a2=a; o.b2=b; return o; });
}
const evSk = r => EVS[r.ev]||'Др.';
function phaseAgg(list){
  const A=[0,1,2].map(()=>({n:0,w:0,F:0,E:0,O:0,W:0,sk:{}}));
  list.forEach(r=>{const x=A[r.ph]; x.n++; if(r.w) x.w++; x[r.k]++; if(r.k==='F'){const k=evSk(r); x.sk[k]=(x.sk[k]||0)+1;}});
  return A;
}
function phaseTable(A){
  const worst = A.reduce((m,x,i)=> x.n && x.F/x.n > (A[m].n?A[m].F/A[m].n:-1) ? i : m, 0);
  const rows=A.map((x,i)=>`<tr${i===worst&&x.n?' style="background:rgba(248,113,113,.08)"':''}><td class="l"><b>${PH_NAMES[i]}</b></td><td>${x.n}</td><td>${x.n?Math.round(x.w/x.n*100):0}%</td>
    <td style="color:var(--bad);font-weight:700">${x.F} <span class="mini">(${x.n?Math.round(x.F/x.n*100):0}%)</span></td><td>${x.E} <span class="mini">(${x.n?Math.round(x.E/x.n*100):0}%)</span></td><td>${x.W}</td><td>${x.O}</td>
    ${ESK.map(k=>`<td style="color:var(--dim)">${x.sk[k]||'·'}</td>`).join('')}</tr>`).join('');
  return `<div class="scroll-x"><table class="ph" aria-label="Ошибки по ходу партии"><thead><tr><th class="l">Фаза</th><th title="Розыгрышей">Розыгр.</th><th title="Доля розыгрышей, выигранных нами">Мы выигр.</th><th title="Наши ошибки (доля от розыгрышей)">Наши ош.</th><th title="Ошибки соперника">Ош. соп.</th><th title="Наши чистые очки">Наши чист.</th><th title="Чистые очки соперника">Чист. соп.</th>${ESK.map(k=>`<th title="Наши ошибки: ${k}">${k}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function findRuns(g,si,min){
  const list=setRallies(g,si), runs=[]; let cur=null;
  list.forEach(r=>{ if(!r.w){ if(!cur) cur={si,a:r.a,b:r.b,items:[]}; cur.items.push(r); } else { if(cur&&cur.items.length>=min) runs.push(cur); cur=null; } });
  if(cur&&cur.items.length>=min) runs.push(cur);
  return runs;
}
function runText(r){
  const F=r.items.filter(x=>x.k==='F'), O=r.items.length-F.length;
  return `<b>Сет ${r.si+1}</b> · ${r.a}:${r.b} → ${r.a}:${r.b+r.items.length} · <b>${r.items.length} очк. подряд</b>: ${F.length} наших ошибок${F.length?' ('+F.map(evSk).join(', ')+')':''}${O?` + ${O} чист. очк. соперника`:''}`;

function spark(vals,labels,o){
  const W=160,H=44,P=6, pts=vals.map((v,i)=>v==null?null:v), ok=pts.filter(v=>v!=null);
  if(!ok.length) return '<div class="mini" style="padding:10px 0">нет данных</div>';
  let lo=Math.min(...ok,o.ref!=null?o.ref:Infinity), hi=Math.max(...ok,o.ref!=null?o.ref:-Infinity); if(hi===lo){hi+=1;lo-=1;}
  const x=i=>vals.length>1? P+i*(W-2*P)/(vals.length-1) : W/2, y=v=>H-P-(v-lo)/(hi-lo)*(H-2*P);
  let path='',prev=false; pts.forEach((v,i)=>{ if(v==null){prev=false;return;} path+=(prev?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1); prev=true; });
  const dots=pts.map((v,i)=>v==null?'':`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" style="fill:var(--acc)"><title>${esc(labels[i])}: ${o.fmt(v)}</title></circle>`).join('');
  const ref=o.ref!=null?`<line x1="${P}" x2="${W-P}" y1="${y(o.ref).toFixed(1)}" y2="${y(o.ref).toFixed(1)}" style="stroke:var(--dim);stroke-dasharray:3 3"/>`:'';
  const last=ok[ok.length-1], prevv=ok.length>1?ok[ok.length-2]:null, d=prevv==null?null:last-prevv;
  const good=d==null?null:((o.dir>0)===(d>0)); 
  const arrow=d==null||Math.abs(d)<1e-9?'':`<span style="color:${good?'var(--good)':'var(--bad)'}">${d>0?'▲':'▼'}</span>`;
  return `<div class="card" style="padding:12px 14px"><div class="mini">${o.title}</div>
    <div style="display:flex;align-items:baseline;gap:8px"><b style="font-size:18px">${o.fmt(last)}</b>${arrow}<span class="mini" style="margin-left:auto">${o.ref!=null?'сезон '+o.fmt(o.ref):''}</span></div>
    <svg class="spk" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${o.title}">${ref}<path d="${path}" style="fill:none;stroke:var(--acc);stroke-width:2"/>${dots}</svg>
    <div class="mini" style="display:flex;justify-content:space-between"><span>${esc(labels[0])}</span><span>${labels.length>1?esc(labels[labels.length-1]):''}</span></div></div>`;
}
function setChart(list){
  const W=220,H=76,P=6; if(!list.length) return '';
  const d=list.map(r=>r.a2-r.b2), m=Math.max(5,...d.map(Math.abs)), x=i=>P+i*(W-2*P)/Math.max(1,list.length-1), y=v=>H/2-v/m*(H/2-P);

function buildLeaders(){
  const pool = playerSeason.filter(p => p.vol > 0);
  const out = [];

  const mvp = effPool.length ? [...effPool].sort((a,b)=>(b.netSet||0)-(a.netSet||0) || effVal(b.eff)-effVal(a.eff))[0] : [...pool].sort((a,b)=>b.util-a.util || effVal(b.eff)-effVal(a.eff))[0];
  if(mvp) out.push({icon:'🏆', title:'Лучший баланс очков', name:mvp.name, value:(mvp.netSet==null?'—':fmtNum(mvp.netSet)), color:'var(--good)',
    sub:`очки − ошибки на партию · всего ${fmtNum(mvp.pts)} − ${fmtNum(mvp.err)} за ${mvp.sets} парт.`, low:false, p:mvp});

  const scorer = [...pool].sort((a,b)=>b.pts-a.pts)[0];
  if(scorer) out.push({icon:'⚡', title:'Лучший бомбардир', name:scorer.name, value:fmtNum(scorer.pts), color:'var(--attack)',
    sub:`очки: атака++ ${fmtNum(scorer.sk.attack.top)} · блок+ ${fmtNum(scorer.sk.block.top)} · эйсы ${fmtNum(scorer.sk.serve.top)}`, low:lowData(scorer)});

  const attacker = [...pool].filter(p=>p.sk.attack.n>=20).sort((a,b)=>(b.sk.attack.topPct||0)-(a.sk.attack.topPct||0))[0] || [...pool].sort((a,b)=>(b.sk.attack.topPct||0)-(a.sk.attack.topPct||0))[0];
  if(attacker) out.push({icon:'🎯', title:'Лучший завершающий', name:attacker.name, value:fmtPct(attacker.sk.attack.topPct), color:'var(--pass)',
    sub:`киллинг ${fmtPct(attacker.sk.attack.topPct)} на ${fmtNum(attacker.sk.attack.n)} атак · эфф. ${fmtPct(attacker.sk.attack.eff)}`, low:lowData(attacker)});

  const receiver = [...pool].filter(p=>p.sk.recv.n>=20).sort((a,b)=>(b.sk.recv.topPct||0)-(a.sk.recv.topPct||0))[0] || [...pool].sort((a,b)=>(b.sk.recv.topPct||0)-(a.sk.recv.topPct||0))[0];
  if(receiver) out.push({icon:'🛡️', title:'Лучший на приёме', name:receiver.name, value:fmtPct(receiver.sk.recv.topPct), color:'var(--recv)',
    sub:`идеальный приём ${fmtPct(receiver.sk.recv.topPct)} на ${fmtNum(receiver.sk.recv.n)} приёмов · эфф. ${fmtPct(receiver.sk.recv.eff)}`, low:lowData(receiver)});

  const aces = [...pool].sort((a,b)=>b.sk.serve.top-a.sk.serve.top)[0];
  if(aces) out.push({icon:'💨', title:'Лучший по эйсам', name:aces.name, value:fmtNum(aces.sk.serve.top), color:'var(--serve)',
    sub:`эйсов · подач ${fmtNum(aces.sk.serve.n)} · эфф. ${fmtPct(aces.sk.serve.eff)}`, low:lowData(aces)});

  const blocker = [...pool].sort((a,b)=>b.sk.block.top-a.sk.block.top)[0];
  if(blocker) out.push({icon:'🧱', title:'Лучший блокирующий', name:blocker.name, value:fmtNum(blocker.sk.block.top), color:'var(--block)',
    sub:`блок-очков · эфф. ${fmtPct(blocker.sk.block.eff)}`, low:lowData(blocker)});

  const setter = [...pool].filter(p=>p.sk.pass.n>=50).sort((a,b)=>effVal(b.sk.pass.eff)-effVal(a.sk.pass.eff))[0];
  if(setter) out.push({icon:'🎪', title:'Лучший связующий', name:setter.name, value:fmtPct(setter.sk.pass.eff), color:'var(--pass)',
    sub:`эфф. передач · ${fmtNum(setter.sk.pass.n)} передач · ошибок паса ${fmtPct(setter.sk.pass.errPct)}`, low:lowData(setter)});

  const useful = [...pool].sort((a,b)=>b.util-a.util)[0];
  if(useful) out.push({icon:'➕', title:'Самый полезный', name:useful.name, value:fmtNum(useful.util), color:'var(--warn)',
    sub:`очки − ошибки = ${fmtNum(useful.pts)} − ${fmtNum(useful.err)}`, low:lowData(useful)});

  return out;
}

    return typeof va==='string' ? st.d*va.localeCompare(vb) : st.d*(va-vb); });

function radarSVG(sk){
  const S=230,CX=S/2,CY=S/2,MR=96;
  const axes=[['attack','Атака'],['serve','Подача'],['recv','Приём'],['def','Защита'],['block','Блок'],['pass','Связка']];
  const n=axes.length;
  const pt=(i,r)=>[CX+Math.cos(Math.PI/2-i*2*Math.PI/n)*r, CY-Math.sin(Math.PI/2-i*2*Math.PI/n)*r];
  let rings='',grid='',poly='',labels='',pts=[];
  for(let g=1;g<=4;g++){
    const r=MR*g/4;
    rings+=`<circle cx="${CX}" cy="${CY}" r="${r}" style="stroke:var(--line);fill:none"/>`;
  }
  axes.forEach(([k,label],i)=>{
    const a=sk[k];
    const ok=a&&(a.eff!=null)&&(a.n>=MIN_SKILL);
    const [x,y]=pt(i,MR);
    grid+=`<line x1="${CX}" y1="${CY}" x2="${x}" y2="${y}" style="stroke:var(--line)"/>`;
    labels+=`<text x="${x}" y="${y}" font-size="11" style="fill:var(--muted)" text-anchor="${Math.abs(x-CX)<2?'middle':x>CX?'start':'end'}" dominant-baseline="middle">${label}</text>`;
    if(ok){ pts.push({v:Math.max(0.03,Math.min(1,(a.eff+1)/2)),i}); }
  });
  if(pts.length>=3){
    const order=pts.slice().sort((a,b)=>a.i-b.i);
    poly+=order.map((o,index)=>{const [x,y]=pt(o.i,MR*o.v);return (index?'L':'M')+x.toFixed(1)+','+y.toFixed(1)}).join('')+'Z';
    pts.forEach(o=>{const [x,y]=pt(o.i,MR*o.v);poly+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" style="fill:var(--acc)"/>`;});
    poly=`<path d="${poly}" style="fill:rgba(94,234,212,.16);stroke:var(--acc);stroke-width:2"/>`;
  }
  const note=pts.length<3?'<div style="color:var(--dim);font-size:11px;text-align:center;margin-top:4px">недостаточно данных для диаграммы (нужно 3+ навыка)</div>':'';
  return `<div style="display:flex;flex-direction:column;align-items:center"><svg width="${S+70}" height="${S}" viewBox="-35 0 ${S+70} ${S}" style="max-width:240px" role="img" aria-label="Радар эффективности по навыкам: ${axes.map(([k,l])=>l+' '+fmtPct(sk[k].eff)).join(', ')}">${rings}${grid}${poly}${labels}</svg>${note}</div>`;
}
function skillDetailCard(key,p){
  const c=SK[key],s=p.sk[key];
  const col='var('+c.c+')';
  const showDiscrete = s.n>0 ? s : null;
  const lowTag = showDiscrete && s.n < MIN_SKILL ? '<span class="mini-tag" style="font-size:9px;margin-left:0">мало данных</span>' : '';
  const topLine = showDiscrete ? `${c.topT}: <b style="color:${col}">${fmtNum(s.top)}</b>` : 'нет действий';
  const segn = showDiscrete ? `<div class="meter" style="margin-top:8px"><i class="pos" style="width:${(s.posPct||0)*100}%"></i><i class="neu" style="width:${Math.max(0,1-(s.posPct||0)-(s.negPct||0))*100}%"></i><i class="neg" style="width:${(s.negPct||0)*100}%"></i></div>` : '';
  const caps = showDiscrete ? `<div class="mini" style="display:flex;justify-content:space-between;margin-top:5px"><span>позитив ${Math.round((s.posPct||0)*100)}%</span><span style="color:var(--bad)">негатив ${Math.round((s.negPct||0)*100)}%</span></div>` : '';
  const defs = showDiscrete ? `<div class="skill-note" style="margin-top:6px">n=${fmtNum(s.n)} · очк.действий ${fmtNum(s.top)} · прямых ошибок ${fmtNum(s.err)} · эфф. ${fmtPct(s.eff)}</div>` : '';
  const benchMap={recv:['recvTop','recvPos'], attack:['kill'], serve:['serveErr']};
  const benchLines=(benchMap[key]||[]).map(k=>benchLine(k,p)).join('');
  return `<div class="card" style="padding:14px 16px">
    <div class="mini" style="text-transform:uppercase;letter-spacing:.05em;color:${col}">${c.name} ${lowTag}</div>
    <div style="display:flex;align-items:baseline;gap:8px;margin-top:6px">
      <span style="font-size:19px;font-weight:800;color:${effColor(s.eff)}">${fmtPct(s.eff)}</span>
      <span class="mini" style="margin-left:auto">${topLine}</span>
    </div>
    ${segn}${caps}${defs}${benchLines}
  </div>`;
}

          <div class="kv-i"><span class="kv-k">НЕ переносим</span><span class="kv-v">ни одну готовую «Общая эффективность» или формулу Excel — все проценты пересчитываются здесь, на странице, по принципам волейбольной статистики.</span></div>
          <div class="kv-i"><span class="kv-k">Кто классифицирует</span><span class="kv-v">статистик ведёт подсчёт во время матча по буквенным определениям («Связка+», «Приём++», «Атака++», «Ошибка» и т.д.).</span></div>
          <div class="kv-i"><span class="kv-k">Где хранятся</span><span class="kv-v">внутри этого файла в блоке <code>const DATA</code>. Сервер не участвует: всё считается локально в браузере при открытии.</span></div>
          <div class="kv-i"><span class="kv-k">Как обновлять</span><span class="kv-v">запустить скрипт <code>update_stats.py</code> (книга.xlsx + эта страница): он пересоберёт блок DATA, сверит очки и ошибки и покажет предупреждения; всё остальное пересчитается автоматически.</span></div>
        </div>
      </div>

      <div class="card" id="m-principle">
        <h3 style="margin-top:0">Основной принцип</h3>
        <p>Каждое действие игрока имеет качество: очко, хорошее, нейтральное, ошибка. Эффективность показывает баланс «пользы» и «вреда» в расчёте на одно действие:</p>
        <div class="formula">Эффективность = (позитив − негатив) / всего действий</div>
        <ul class="m-legend">
          <li><span class="dp pos"></span><b>Позитив</b> — очко или явное преимущество: киллы, эйсы, блок-очки, идеальные приёмы и передачи.</li>
          <li><span class="dp neg"></span><b>Негатив</b> — прямые ошибки и действия, отдающие инициативу.</li>
          <li><span class="dp nul"></span><b>Нейтрально</b> — мяч просто остаётся в игре: в числитель не входит, но в знаменатель входит.</li>
        </ul>
        <p class="mini" style="margin-top:4px">Формулы открыты и воспроизводимы.</p>
      </div>
    </div>

    <div class="card" id="m-skills">
      <h3 style="margin-top:0">Семь групп действий и их формулы</h3>
      <div class="ms">
        ${METHOD_SKILLS.map(([n,cc,sub,desc,f])=>`<div class="ms-i">
          <div class="msbar"><span class="msn"><span class="sk-dot" style="background:var(${cc})"></span>${n}</span><span class="mini">${sub}</span></div>
          <div class="msd">${desc}</div>
          <div class="formula">${f}</div>
        </div>`).join('')}
      </div>
      <p class="mini" style="margin-top:10px">Ключевая деталь: «Связка −» и перелёты «/» приравнены к негативу, поэтому «недоведённый» мяч честно снижает эффективность группы — так же, как в классическом приёме.</p>
    </div>

    <div class="grid m2">
      <div class="card pad0" id="m-derived" style="overflow:hidden">
        <div style="padding:16px 18px 4px"><h3 style="margin-top:0">Производные показатели</h3></div>
        <div class="scroll-x"><table class="mt">
          <thead><tr><th class="l">Показатель</th><th class="l">Формула</th><th class="l">Смысл</th></tr></thead>
          <tbody>
            <tr><td class="l">Очки</td><td class="l">Атака++ + Блок+ + Эйсы</td><td class="l">сколько очков игрок принёс команде</td></tr>
            <tr><td class="l">Ошибки</td><td class="l">сумма прямых ошибок по всем 7 группам</td><td class="l">сколько «подарил» сопернику</td></tr>
            <tr><td class="l">Полезность</td><td class="l">Очки − Ошибки</td><td class="l">чистый «вклад в счёт» матча</td></tr>
            <tr><td class="l">Киллинг%</td><td class="l">Атака++ / все атаки</td><td class="l">доля атак, приносящих очко</td></tr>
            <tr><td class="l">Идеальный приём%</td><td class="l">Приём++ / все приёмы</td><td class="l">доля «чистых» приёмов подачи</td></tr>
          </tbody>
        </table></div>
      </div>

      <div class="card" id="m-index">
        <h3 style="margin-top:0">Сводная эффективность (справочно)</h3>
        <div class="formula">Индекс = (Σ позитив − Σ негатив) / Σ действий</div>
        <p style="margin-top:8px">Индекс взвешен по объёму: у каждого действия равный вес, независимо от группы. Поэтому блок с ошибками не «топит» серию из 100 приёмов, как это было в исходной книге, где группы складывались с равными весами. В таблицах рейтинга эта цифра не используется, потому что у связующего она завышена.</p>
        <p>Это суммарная характеристика всех групп, но формула открыта и полностью воспроизводима.</p>
      </div>
    </div>

    <div class="grid m2">
      <div class="card" id="m-reliab">
        <h3 style="margin-top:0">Надёжность выборки</h3>
        <p>Процент при малом числе действий статистически бессмыслен — страница помечает сомнительные выборки.</p>
        <div class="scroll-x"><table class="mt">
          <thead><tr><th class="l">Условие</th><th class="l">Где применяется</th><th class="l">Пометка</th></tr></thead>
          <tbody>
            <tr><td class="l">≥ ${MIN_SKILL} действий</td><td class="l">отдельный навык</td><td class="l">показатель скрыт «—»</td></tr>
            <tr><td class="l">≥ ${MIN_VOL} действий и ≥ ${MIN_GAMES} матча</td><td class="l">общий рейтинг игроков</td><td class="l"><span class="mini-tag">мало данных</span></td></tr>
            <tr><td class="l">&lt; ${MIN_MATCH} действий</td><td class="l">строки матчевой таблицы</td><td class="l">строка приглушена</td></tr>
          </tbody>
        </table></div>
        <p class="mini" style="margin-top:8px">Пример: при 8 действиях разница «0%» и «50%» — это разница в 4 события. По таким выборкам выводы делать нельзя.</p>
      </div>

      <div class="card" id="m-diff">
        <h3 style="margin-top:0">Отличия от исходной книги</h3>
        <p>В книге «Итог» матча считался как среднее взвешенных баллов по пяти группам без учёта их объёма (веса из листа «Consts»). Это занижало всех, кроме специалистов одной группы, и добавляло шум от дробных полублоков. На странице:</p>
        <ul>
          <li>персональные E% каждой группы — без весов;</li>
          <li>сводная эффективность (справочно) — взвешена по объёму действий;</li>
          <li>добавлены киллинг%, идеальный приём%, очки − ошибки (за партию и на 100 действий), эйсы, блок-очки, баланс очков.</li>
        </ul>
        <p>Факты берутся из листов матчей как есть; в общее число передач входит и «Связка −» (в книге формула её исключает, из-за чего эффективность связующего завышалась). Поэтому числа страницы и «Общая эффективность» в Excel не совпадают — это сделано намеренно.</p>
      </div>
    </div>

    <div class="card" id="m-new" style="margin-bottom:14px">
      <h3 style="margin-top:0">Баланс, точки роста и ±/партия</h3>
      <ul>
        <li><b>Баланс очков</b> = чистые очки (атака++, блок+, эйсы) + ошибки соперника − наши ошибки − чистые очки соперника. Счёт соперника берётся из листов «Динамика».</li>
        <li><b>±/партия</b> = (очки − ошибки) / число партий игрока; <b>Ош/100</b> = прямые ошибки на 100 действий. Так загрузка игрока не искажает сравнение.</li>
        <li><b>Точки роста</b> = действия × (доля ошибок игрока − доля ошибок команды). «Устойчиво» — отличие проходит проверку Уилсона (95%), иначе возможен шум.</li>
        <li><b>Сводная эфф.</b> у связующего завышена множеством безошибочных передач; не используйте её как единственный критерий.</li>
        <li><b>Ход партии</b>: фазы по числу очков лидера (старт — до 40% очков партии, середина, концовка — от 80%); серии — 3+ очка соперника подряд. Источник — лист «Динамика»: он сходится с таблицей статистики (наши ошибки, чистые очки, ошибки соперника), кроме расхождений на 1 очко в нескольких партиях.</li>
      </ul>
    </div>
    <div class="note" id="m-note">
      <h3>Сноска аналитика: можно ли этим данным верить</h3>
      <p><b>Технически данные сверяются автоматически.</b> Страница сама проверяет в каждой партии: очки = чистые очки + ошибки соперника, а ошибки игроков = ошибки команды; результат — внизу блока «Баланс очков» на вкладке «Обзор».</p>
      <p><b>Но это ручная разметка одного наблюдателя без видеоповторов.</b> Качество приёма, защиты или «связка −» — субъективная оценка: один и тот же эпизод два статистика могут закодировать по-разному. Спорные моменты (полукасание блока, спасение через «/», мяч на линии) легко уходят на соседнюю категорию.</p>
      <p><b>Насколько близко к реальности.</b> Счётная часть (очки, ошибки, объёмы) — высокая достоверность, погрешность порядка ±1–2 события на матч. Оценочная часть может «гулять» на несколько процентных пунктов: при выборке ≥100 действий одно перекодированное событие меняет эффективность не более чем на ~1 п.п., при 30 действиях — на ~3 п.п. Поэтому зазор в 2–3% эффективности между игроками — это ещё не факт, а сигнал.</p>
      <p><b>Как правильно читать страницу:</b></p>
      <ul>
        <li>Смотрите на <b>объём</b> вместе с процентом: высокий E% на 2–4 действиях ничего не значит.</li>
        <li>Сравнивайте только сопоставимые роли. У связующего в схеме 5–1 почти нет атак, и сравнивать его киллинг% с доигровщиком бессмысленно.</li>
        <li><b>Полезность</b> (очки − ошибки) — самый наглядный показатель баланса, но он не видит невидимую работу: доводку, страхование, блок-аут.</li>
        <li>Разницу в эффективности ≈3 п.п. и меньше при объёме 30–200 действий считайте шумом, а не фактом.</li>
        <li>Для решений (награды, ротация) смотрите несколько матчей: объём + полезность + стабильность, а не один яркий сет.</li>
      </ul>
      <p style="margin-top:10px"><b>Итоговая оценка.</b> Страница точно отражает тот образ игры, который зафиксировала разметка, и честно показывает относительные роли игроков. Абсолютные проценты нужно интерпретировать с поправкой на субъективность разметки и объём выборки — сами по себе они показывают тенденции, а не точные уровни мастерства.</p>
    </div>
  </div>`;

setTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark', false);
$('#tabs').addEventListener('keydown', e => {
  const tabs = [...$('#tabs').querySelectorAll('.tab')];
  const i = tabs.indexOf(document.activeElement);
  if(i<0) return;
  let j=-1;
  if(e.key==='ArrowRight'||e.key==='ArrowDown') j=(i+1)%tabs.length;
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp') j=(i-1+tabs.length)%tabs.length;
  else if(e.key==='Home') j=0;
  else if(e.key==='End') j=tabs.length-1;
  if(j<0) return;
  e.preventDefault();
  tabs[j].focus();
  tabs[j].click();
});
$('#tag-games').textContent = gamesCount;
$('#tag-players').textContent = playersCount;

    <li><b>Баланс очков</b> = наши очки − очки соперников. Он складывается из чистых очков, ошибок соперника и наших ошибок.</li>

function showFatal(err){
  try{
    document.body.innerHTML = '<div class="wrap"><div class="card" style="border-color:var(--bad)"><h2 style="font-size:18px;margin-bottom:8px">Не удалось загрузить статистику</h2><p style="color:var(--muted);margin-bottom:8px">Произошла ошибка при инициализации страницы. Попробуйте переоткрыть файл.</p><pre style="overflow:auto;font-size:11px;color:var(--bad)">'+String(err&&err.stack||err).replace(/[<>&]/g,function(m){return m==='<'?'&lt;':m==='>'?'&gt;':'&amp;';})+'</pre></div></div>';
  }catch(_){ document.body.textContent = 'Ошибка загрузки: '+String(err); }
}
